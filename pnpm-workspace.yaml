packages:
  - '!**/.*/**'
  - '!**/artifacts/**'
  - 'packages/*'
  - 'src/assets'
  - 'common-features'
  - 'common-features/src/*'
  - 'serene/src/Serene.Web'

allowBuilds:
  core-js: true
  esbuild: true
  msw: true

catalogs:
  serenity:
    "@floating-ui/dom": "1.8.0"
    "@preact/signals-core": "1.14.4"
    "@vitest/coverage-v8": "5.0.5"
    "chart.js": "4.6.1"
    "dompurify": "3.4.17"
    "esbuild": "0.28.2"
    "es-module-lexer": "3.0.4"
    "flatpickr": "4.6.13"
    "glightbox": "3.3.1"
    "jsdom": "30.1.3"
    "moment": "2.31.0"
    "preact": "11.0.2"
    "tinyglobby": "0.2.17"
    "typescript": "7.1.0-beta"
    "vite": "8.3.5"
    "vitest": "5.0.5"

overrides:
  dompurify@<3.4.13: ^3.4.16
  undici@<7.29.0: ^7.29.0
  nanoid@<3.3.18: ^3.3.18
  fflate@>=0.8.0 <0.8.3: ^0.8.3
  prosemirror-view@<1.42.3: ^1.42.3
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
